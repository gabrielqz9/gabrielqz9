<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" role="img" aria-label="Banner de inicialização do sistema J.A.R.V.I.S" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="320" rx="14"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }

    /* Ciclo de 12s: cada elemento entra em sequência, permanece e reinicia */
    .ln { opacity: 0; animation: ln 12s infinite; }
    @keyframes ln {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      90%  { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    .d1 { animation-delay: .4s; }
    .d2 { animation-delay: 1.2s; }
    .d3 { animation-delay: 2.0s; }
    .d4 { animation-delay: 2.8s; }
    .d5 { animation-delay: 3.6s; }
    .d6 { animation-delay: 4.6s; }
    .d7 { animation-delay: 5.4s; }

    .spin  { transform-origin: 780px 160px; animation: spin 18s linear infinite; }
    .spinr { transform-origin: 780px 160px; animation: spin 26s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-10px); } to { transform: translateY(330px); } }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .ln, .spin, .spinr, .scan, .blink, .pulse { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- linha de varredura -->
    <rect class="scan" width="1000" height="3" fill="#00e5ff" opacity=".18"/>

    <!-- barra de status -->
    <text x="40" y="38" font-size="12" fill="#5d7088">SYS://PROFILE.INIT</text>
    <text x="960" y="38" font-size="12" fill="#5d7088" text-anchor="end">BUILD 2026.10 · SECURE LINK</text>
    <line x1="40" y1="50" x2="960" y2="50" stroke="#00e5ff" stroke-opacity=".25"/>

    <!-- sequência de boot -->
    <g font-size="15">
      <text class="ln d1" x="40" y="92" fill="#9fb3c8">&gt; iniciando núcleo ................ <tspan fill="#00e5ff" font-weight="700">[ OK ]</tspan></text>
      <text class="ln d2" x="40" y="118" fill="#9fb3c8">&gt; carregando módulos neurais ....... <tspan fill="#00e5ff" font-weight="700">[ OK ]</tspan></text>
      <text class="ln d3" x="40" y="144" fill="#9fb3c8">&gt; sincronizando repositórios ....... <tspan fill="#00e5ff" font-weight="700">[ OK ]</tspan></text>
      <text class="ln d4" x="40" y="170" fill="#9fb3c8">&gt; estabelecendo uplink ............. <tspan fill="#ff2e88" font-weight="700">[ ON ]</tspan></text>
    </g>

    <!-- título -->
    <g filter="url(#glow)">
      <text class="ln d5" x="40" y="232" font-size="46" font-weight="700" letter-spacing="4" fill="url(#neon)">SEU NOME</text>
    </g>
    <text class="ln d6" x="42" y="264" font-size="15" fill="#8b9bb4" letter-spacing="2">AI ENGINEER · FULL STACK · CYBER ARCHITECT</text>
    <rect class="blink" x="42" y="278" width="10" height="3" fill="#00e5ff"/>

    <!-- HUD circular -->
    <g class="ln d7" filter="url(#glow)">
      <circle class="spin" cx="780" cy="160" r="118" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="70 18 12 18" opacity=".9"/>
      <circle class="spinr" cx="780" cy="160" r="96" fill="none" stroke="#ff2e88" stroke-width="1.5" stroke-dasharray="3 9"/>
      <circle class="spin" cx="780" cy="160" r="72" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="320 130"/>
      <circle cx="780" cy="160" r="46" fill="#00e5ff" fill-opacity=".07" stroke="#00e5ff" stroke-opacity=".8"/>
      <text x="780" y="170" font-size="28" font-weight="700" text-anchor="middle" fill="#00e5ff">A.I.</text>
    </g>
    <text class="pulse" x="780" y="304" font-size="13" text-anchor="middle" fill="#00e5ff" letter-spacing="3">● SYSTEM ONLINE</text>

    <!-- cantos HUD -->
    <g fill="none" stroke="#00e5ff" stroke-width="2" opacity=".8">
      <path d="M14 36V14H36"/>
      <path d="M964 14H986V36"/>
      <path d="M14 284V306H36"/>
      <path d="M986 284V306H964"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="319" rx="14" fill="none" stroke="#00e5ff" stroke-opacity=".3"/>
</svg>
